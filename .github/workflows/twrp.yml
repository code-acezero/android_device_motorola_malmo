name: Build TWRP for Moto G85 (12.1 Stable)

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build 12.1
    runs-on: ubuntu-22.04

    steps:
    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip python-is-python3

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize Repo (TWRP 12.1)
      run: |
        export PATH=~/bin:$PATH
        mkdir workspace
        cd workspace
        # 🟢 USING STABLE 12.1 SOURCE
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone https://github.com/code-acezero/android_device_motorola_malmo temp_tree
        mkdir -p device/motorola/malmo
        cp -r temp_tree/* device/motorola/malmo/
        rm -rf temp_tree

    - name: 🟢 APPLY KERNEL FIX (Injecting into Configs)
      run: |
        cd workspace/device/motorola/malmo
        
        # 1. Start Fresh
        rm -f vendorsetup.sh AndroidProducts.mk twrp_malmo.mk
        
        # 2. Generate vendorsetup.sh (Works perfectly in 12.1)
        echo "add_lunch_combo twrp_malmo-eng" > vendorsetup.sh
        
        # 3. Generate AndroidProducts.mk
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/twrp_malmo.mk" > AndroidProducts.mk
        echo "COMMON_LUNCH_CHOICES := twrp_malmo-eng" >> AndroidProducts.mk

        # 4. Generate twrp_malmo.mk
        echo "\$(call inherit-product, device/motorola/malmo/device.mk)" > twrp_malmo.mk
        echo "\$(call inherit-product, \$(SRC_TARGET_DIR)/product/aosp_base.mk)" >> twrp_malmo.mk
        echo "\$(call inherit-product, \$(SRC_TARGET_DIR)/product/core_64_bit.mk)" >> twrp_malmo.mk
        echo "\$(call inherit-product, vendor/twrp/config/common.mk)" >> twrp_malmo.mk
        echo "PRODUCT_NAME := twrp_malmo" >> twrp_malmo.mk
        echo "PRODUCT_DEVICE := malmo" >> twrp_malmo.mk
        echo "PRODUCT_BRAND := motorola" >> twrp_malmo.mk
        echo "PRODUCT_MODEL := moto g85 5G" >> twrp_malmo.mk
        echo "PRODUCT_MANUFACTURER := motorola" >> twrp_malmo.mk
        
        # 5. 🟢 CRITICAL KERNEL FIX
        # We inject the kernel path directly into BoardConfig.mk
        echo '' >> BoardConfig.mk
        echo '# FORCED KERNEL PATH' >> BoardConfig.mk
        echo 'TARGET_PREBUILT_KERNEL := device/motorola/malmo/prebuilt/kernel' >> BoardConfig.mk
        echo 'BOARD_BOOT_HEADER_VERSION := 2' >> BoardConfig.mk
        
        # 6. Fix rsync bug (Common in 12.1 builds)
        cd ../../..
        sed -i 's/rsync -a --exclude=sdcard/rsync -a --exclude=sdcard --exclude=vendor/g' build/make/core/Makefile

    - name: Build Recovery
      run: |
        export PATH=~/bin:$PATH
        cd workspace
        . build/envsetup.sh
        lunch twrp_malmo-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-G85-5G
        path: workspace/out/target/product/malmo/recovery.img
