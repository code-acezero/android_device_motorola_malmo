name: Build TWRP for Moto G85

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize Repo (Low Space Mode)
      run: |
        export PATH=~/bin:$PATH
        mkdir workspace
        cd workspace
        # using depth=1 to save space
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all)

    - name: Clone Device Tree (With Structure Fix)
      run: |
        cd workspace
        # 1. Create the target directory
        mkdir -p device/motorola/malmo
        
        # 2. Clone into a temporary folder first
        git clone https://github.com/code-acezero/android_device_motorola_malmo temp_repo
        
        # 3. Check for the "Russian Doll" nesting
        if [ -d "temp_repo/device/motorola/malmo" ]; then
            echo "⚠️ Nested structure detected! Moving inner files up..."
            mv temp_repo/device/motorola/malmo/* device/motorola/malmo/
        else
            echo "Standard structure detected. Moving files directly..."
            mv temp_repo/* device/motorola/malmo/
        fi
        
        # 4. Clean up temp folder
        rm -rf temp_repo
        echo "✅ Device tree placed correctly."

    - name: 🔧 FIX - Check DTB Name
      run: |
        cd workspace/device/motorola/malmo/prebuilt
        echo "Checking contents of prebuilt folder..."
        ls -la
        
        # Rename dtb to dtb.img only if it isn't already named that
        if [ -f "dtb" ]; then
            mv dtb dtb.img
            echo "Renamed 'dtb' to 'dtb.img'"
        elif [ -f "dtb.img" ]; then
            echo "File is already named 'dtb.img'. Perfect."
        else
            echo "❌ ERROR: No dtb file found! Something went wrong with the move."
            exit 1
        fi

    - name: Build Recovery
      run: |
        export PATH=~/bin:$PATH
        cd workspace
        . build/envsetup.sh
        lunch omni_malmo-eng
        # Removed swap as requested, keeping -j2 for safety
        make -j2 vendorbootimage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-G85
        path: workspace/out/target/product/malmo/vendor_boot.img
