name: Build TWRP for Moto G85

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04

    steps:
   
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

  

        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize Repo (TWRP 12.1 ---- low space mode)
      run: |
        export PATH=~/bin:$PATH
        mkdir workspace
        cd workspace
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all)

    - name: Clone Your Device Tree
      run: |
        cd workspace
        git clone https://github.com/code-acezero/android_device_motorola_malmo device/motorola/malmo


   - name: 🔧 FIX - Force Rename DTB (The Nuclear Option)
      run: |
        echo "Looking for DTB file..."
        cd workspace/device/motorola/malmo/prebuilt
        
        # Find whatever file is there (dtb, dtb.img, or dtb.dtb)
        FILE=$(ls dtb* | head -n 1)
        echo "Found file: $FILE"
        
        # Rename it to 'dtb.img' so we are 100% sure of the name
        mv "$FILE" dtb.img
        echo "Renamed $FILE to dtb.img"
        
        # Verify it exists now
        ls -la dtb.img



    - name: Build Recovery
      run: |
        export PATH=~/bin:$PATH
        cd workspace
        . build/envsetup.sh
        lunch omni_malmo-eng
        # Using -j2 WITH swap space ensures success
        make -j2 vendorbootimage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-G85
        path: workspace/out/target/product/malmo/vendor_boot.img
