name: Build TWRP for Moto G85 5G

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize Repo (Low Space Mode)
      run: |
        export PATH=~/bin:$PATH
        mkdir workspace
        cd workspace
        # 1. Initialize the Manifest
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
        
        # 🟢 2. THE FIX: Create a local manifest to EXCLUDE the massive Rust repo
        mkdir -p .repo/local_manifests
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <manifest>
            <remove-project name="platform/prebuilts/rust" />
        </manifest>' > .repo/local_manifests/remove_rust.xml
        
        # 3. Sync (Now lighter!)
        repo sync -c -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        # 🟢 FIX: Copy the specific branch we are working on into the workspace
        # We use the GITHUB_WORKSPACE variable to find your current edited files
        cp -r ${GITHUB_WORKSPACE} workspace/device/motorola/malmo
        
    - name: Build Recovery
      run: |
        export PATH=~/bin:$PATH
        cd workspace
        . build/envsetup.sh
        
        # 🟢 CHANGED: Switched to 'twrp_malmo-eng' (Matches your new makefile name)
        lunch twrp_malmo-eng
        
        # Build Dedicated Recovery
        mka recoveryimage -j$(nproc --all)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-G85-5G
        # Uploading the recovery.img
        path: workspace/out/target/product/malmo/recovery.img
