name: Build TWRP for Moto G85

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize Repo (TWRP 12.1)
      run: |
        export PATH=~/bin:$PATH
        mkdir workspace
        cd workspace
        # We use TWRP 12.1 manifest because it supports Android 12/13/14 decryption better
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j$(nproc --all)

    - name: Clone Your Device Tree
      run: |
        # Cloning your specific repo into the build folder
        git clone https://github.com/code-acezero/android_device_motorola_malmo device/motorola/malmo

    - name: Build Recovery
      run: |
        export PATH=~/bin:$PATH
        cd workspace
        . build/envsetup.sh
        lunch twrp_malmo-eng
        # Building vendor_boot because G85 is a GKI device
        mka vendorbootimage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-G85
        path: workspace/out/target/product/malmo/vendor_boot.img
