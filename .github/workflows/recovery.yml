name: Build TWRP for Moto G85 5G

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build?'
        required: false
        default: 'false'

jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04

    steps:
    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip bc libssl-dev

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo 'export PATH=~/bin:$PATH' >> ~/.bashrc
        export PATH=~/bin:$PATH

    - name: Initialize TWRP Source
      run: |
        export PATH=~/bin:$PATH
        mkdir -p workspace
        cd workspace
        
        echo "=== Initializing TWRP 14.1 ==="
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
        
        echo "=== Syncing base source ==="
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd workspace
        
        echo "=== Cloning device tree ==="
        mkdir -p device/motorola
        git clone -b malmo-a14-twrp https://github.com/code-acezero/android_device_motorola_malmo device/motorola/malmo
        
        echo "=== Device tree contents ==="
        ls -la device/motorola/malmo/

    - name: Setup Build Environment
      run: |
        cd workspace
        
        echo "=== Setting up environment ==="
        . build/envsetup.sh
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        echo "=== Checking available products ==="
        # List available products
        echo "Available lunch combos:" | get_build_var COMMON_LUNCH_CHOICES 2>/dev/null || echo "Could not get lunch combos"

    - name: Build Recovery
      run: |
        cd workspace
        
        . build/envsetup.sh
        
        echo "=== Attempting build ==="
        
        # Method 1: Try lunch first
        if lunch twrp_malmo-eng 2>/dev/null; then
          echo "✓ Lunch successful with twrp_malmo-eng"
          mka recoveryimage -j$(nproc --all)
        else
          echo "⚠ Lunch failed, trying direct build..."
          
          # Method 2: Direct build
          export TARGET_DEVICE=malmo
          export TARGET_PRODUCT=twrp_malmo
          
          make recoveryimage -j$(nproc --all) 2>&1 | tee build.log
        fi

    - name: Check Build Output
      run: |
        cd workspace
        
        echo "=== Build output ==="
        
        if [ -f out/target/product/malmo/recovery.img ]; then
          echo "✓ SUCCESS: recovery.img found!"
          ls -lh out/target/product/malmo/recovery.img
          
          # Check if it's TWRP
          echo "=== Checking TWRP signature ==="
          if file out/target/product/malmo/recovery.img | grep -q "Android bootimg"; then
            echo "✓ Valid Android boot image"
          fi
        else
          echo "✗ No recovery.img found"
          echo "Looking for any output..."
          find out/target/product -type f -name "*.img" 2>/dev/null | head -10
        fi

    - name: Upload Recovery Image
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery
        path: workspace/out/target/product/malmo/*.img
        if-no-files-found: error

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs
        path: |
          workspace/build.log
          workspace/out/error.log
        if-no-files-found: ignore
