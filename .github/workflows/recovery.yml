name: Build TWRP for Moto G85 5G

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04

    steps:
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize Repo
      run: |
        export PATH=~/bin:$PATH
        mkdir workspace
        cd workspace
        # 1. Init Android 14 (TWRP 14.1)
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
        
        # 2. Exclude Rust to save space
        mkdir -p .repo/local_manifests
        echo '<?xml version="1.0" encoding="UTF-8"?><manifest><remove-project name="platform/prebuilts/rust" /></manifest>' > .repo/local_manifests/remove_rust.xml
        
        # 3. Sync
        repo sync -c -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        cd workspace
        # Clone your repo to the correct path
        git clone https://github.com/code-acezero/android_device_motorola_malmo device/motorola/malmo

    - name: 🟢 FORCE FIX DEVICE TREE (The Nuclear Option)
      run: |
        cd workspace/device/motorola/malmo
        
        # 1. DELETE OLD FILES that cause conflicts
        rm -f vendorsetup.sh omni_malmo.mk
        
        # 2. GENERATE AndroidProducts.mk
        echo 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/twrp_malmo.mk' > AndroidProducts.mk
        echo 'COMMON_LUNCH_CHOICES := twrp_malmo-eng' >> AndroidProducts.mk
        
        # 3. GENERATE twrp_malmo.mk
        echo '# Generated by CI' > twrp_malmo.mk
        echo '$(call inherit-product, device/motorola/malmo/device.mk)' >> twrp_malmo.mk
        echo '$(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)' >> twrp_malmo.mk
        echo '$(call inherit-product, vendor/twrp/config/common.mk)' >> twrp_malmo.mk
        echo 'PRODUCT_NAME := twrp_malmo' >> twrp_malmo.mk
        echo 'PRODUCT_DEVICE := malmo' >> twrp_malmo.mk
        echo 'PRODUCT_BRAND := motorola' >> twrp_malmo.mk
        echo 'PRODUCT_MODEL := moto g85 5G' >> twrp_malmo.mk
        echo 'PRODUCT_MANUFACTURER := motorola' >> twrp_malmo.mk
        
        # 4. GENERATE device.mk (Clean version)
        echo 'LOCAL_PATH := device/motorola/malmo' > device.mk
        echo 'PRODUCT_COPY_FILES += $(LOCAL_PATH)/recovery/root/init.recovery.qcom.rc:recovery/root/init.recovery.qcom.rc' >> device.mk
        echo 'PRODUCT_COPY_FILES += $(LOCAL_PATH)/recovery/root/init.recovery.usb.rc:recovery/root/init.recovery.usb.rc' >> device.mk
        echo 'PRODUCT_COPY_FILES += $(LOCAL_PATH)/recovery/root/system/etc/recovery.fstab:recovery/root/system/etc/recovery.fstab' >> device.mk
        echo 'PRODUCT_COPY_FILES += $(LOCAL_PATH)/recovery/root/system/etc/twrp.flags:recovery/root/system/etc/twrp.flags' >> device.mk
        echo 'PRODUCT_PACKAGES += android.hardware.boot@1.0-impl android.hardware.boot@1.0-service android.hardware.boot@1.0-impl.recovery' >> device.mk
        echo 'PRODUCT_PROPERTY_OVERRIDES += ro.twrp.vendor_boot=true ro.boot.dynamic_partitions=true' >> device.mk

    - name: Build Recovery
      run: |
        export PATH=~/bin:$PATH
        cd workspace
        . build/envsetup.sh
        
        # Verify files exist (Debug)
        ls -l device/motorola/malmo/
        
        # Build
        lunch twrp_malmo-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-G85-5G
        path: workspace/out/target/product/malmo/recovery.img
