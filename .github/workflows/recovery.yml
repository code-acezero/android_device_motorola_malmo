name: Build TWRP for Moto G85 5G

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI (Android 12.1)
    runs-on: ubuntu-22.04

    steps:
    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python3 python3-pip python-is-python3 bc libssl-dev rsync
        
        # Set git config to avoid repo sync errors
        git config --global user.email "bot@github.com"
        git config --global user.name "GitHub Actions Bot"

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize Repo & Sync
      run: |
        mkdir -p workspace
        cd workspace
        
        # Initialize TWRP 12.1 (Android 12 based)
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        
        # Local Manifest
        mkdir -p .repo/local_manifests
        cat > .repo/local_manifests/malmo.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="code-acezero/android_device_motorola_malmo" 
                   path="device/motorola/malmo" 
                   remote="github" 
                   revision="main" />
        </manifest>
        EOF
        
        # Sync with Retry Logic (Network stability fix)
        echo "Syncing repo... (This may take a while)"
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags || \
        repo sync -c -j1 --force-sync --no-clone-bundle --no-tags

    - name: Patch Device Tree for TWRP 12.1
      run: |
        cd workspace/device/motorola/malmo
        
        echo "=== Patching Makefiles ==="
        
        # 1. Create twrp_malmo.mk
        cat > twrp_malmo.mk << 'EOF'
        # Generated by CI
        $(call inherit-product, device/motorola/malmo/device.mk)
        $(call inherit-product, $(SRC_TARGET_DIR)/product/aosp_base.mk)
        $(call inherit-product, vendor/twrp/config/common.mk)
        
        PRODUCT_DEVICE := malmo
        PRODUCT_NAME := twrp_malmo
        PRODUCT_BRAND := motorola
        PRODUCT_MODEL := Moto G85 5G
        PRODUCT_MANUFACTURER := motorola
        EOF
        
        # 2. Force AndroidProducts.mk
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/twrp_malmo.mk" > AndroidProducts.mk
        echo "COMMON_LUNCH_CHOICES := twrp_malmo-eng" >> AndroidProducts.mk
        
        # 3. Clean BoardConfig.mk (Remove Android 14 specifics to avoid conflict)
        if [ -f BoardConfig.mk ]; then
            sed -i '/PLATFORM_VERSION/d' BoardConfig.mk
            sed -i '/TW_USE_FSCRYPT_POLICY/d' BoardConfig.mk
            
            # Inject A12 Platform Version
            echo "" >> BoardConfig.mk
            echo "PLATFORM_VERSION := 12.1.0" >> BoardConfig.mk
            echo "PLATFORM_VERSION_LAST_STABLE := 12.1.0" >> BoardConfig.mk
            echo "TW_THEME := portrait_hdpi" >> BoardConfig.mk
        fi

    - name: Build TWRP
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        # Java Optimization
        export _JAVA_OPTIONS="-Xmx4g"
        
        # Setup Environment
        . build/envsetup.sh
        
        echo "=== Lunching ==="
        lunch twrp_malmo-eng
        
        echo "=== Building ==="
        # Build recovery, but also try vendor_boot in case it's a GKI device
        mka recoveryimage bootimage -j$(nproc --all)

    - name: Identify and Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Build-Result
        path: |
          workspace/out/target/product/malmo/recovery.img
          workspace/out/target/product/malmo/boot.img
          workspace/out/target/product/malmo/vendor_boot.img
          workspace/out/target/product/malmo/dtbo.img
        if-no-files-found: warn
