name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip bc libssl-dev
    
    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo 'export PATH=$HOME/bin:$PATH' >> ~/.bashrc
        export PATH=$HOME/bin:$PATH
    
    - name: Initialize TWRP Source
      run: |
        export PATH=$HOME/bin:$PATH
        mkdir -p workspace
        cd workspace
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
    
    - name: Clone Device Tree
      run: |
        cd workspace
        mkdir -p device/motorola
        git clone -b malmo-a14-twrp https://github.com/code-acezero/android_device_motorola_malmo device/motorola/malmo
    
    - name: Fix Device Tree
      run: |
        cd workspace/device/motorola/malmo
        echo 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/twrp_malmo.mk' > AndroidProducts.mk
        echo 'COMMON_LUNCH_CHOICES := twrp_malmo-eng' >> AndroidProducts.mk
    
    - name: Build Recovery
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        make recoveryimage TARGET_DEVICE=malmo -j$(nproc --all)
    
    - name: Upload Recovery
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery
        path: workspace/out/target/product/malmo/recovery.img
