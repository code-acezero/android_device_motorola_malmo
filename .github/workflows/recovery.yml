name: Build TWRP for Moto G85 5G

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04

    steps:
    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip bc rsync

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize Repo
      run: |
        export PATH=~/bin:$PATH
        mkdir -p workspace
        cd workspace
        # Init TWRP manifest
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
        
        # Exclude Rust to save space
        mkdir -p .repo/local_manifests
        echo '<?xml version="1.0" encoding="UTF-8"?><manifest><remove-project name="platform/prebuilts/rust" /></manifest>' > .repo/local_manifests/remove_rust.xml
        
        # Sync
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd workspace
        mkdir -p device/motorola/malmo
        git clone https://github.com/code-acezero/android_device_motorola_malmo device/motorola/malmo

    - name: Debug Device Tree Structure
      run: |
        cd workspace/device/motorola/malmo
        
        echo "=== Current files in device tree ==="
        ls -la
        
        echo "=== Content of all .mk files ==="
        for mkfile in *.mk; do
          echo "===== $mkfile ====="
          cat "$mkfile"
          echo ""
        done
        
        echo "=== Checking AndroidProducts.mk ==="
        cat AndroidProducts.mk

    - name: Try Building with Debug Info
      run: |
        export PATH=~/bin:$PATH
        cd workspace
        
        echo "=== Setting up environment ==="
        . build/envsetup.sh
        
        echo "=== Checking available products ==="
        # List all products
        echo "All lunch combos:" | get_build_var COMMON_LUNCH_CHOICES 2>/dev/null || echo "Could not get lunch combos"
        
        echo "=== Trying to lunch ==="
        # Try with more debugging
        set -x  # Enable debug output
        if lunch twrp_malmo-eng; then
          echo "✓ Lunch successful!"
          
          echo "=== Starting build with detailed output ==="
          # Build with maximum verbosity
          mka recoveryimage -j1 2>&1 | tee build_output.log
          
          # Check exit status
          BUILD_STATUS=$?
          echo "Build exited with status: $BUILD_STATUS"
          
          if [ $BUILD_STATUS -eq 0 ]; then
            echo "✓ Build successful!"
          else
            echo "✗ Build failed!"
            echo "=== Last 50 lines of build output ==="
            tail -50 build_output.log
          fi
        else
          echo "✗ Lunch failed!"
          echo "=== Trying to find the correct product name ==="
          
          # Try alternative product names
          for product in omni_malmo aosp_malmo lineage_malmo; do
            echo "Trying: $product-eng"
            if lunch $product-eng 2>/dev/null; then
              echo "✓ Found working product: $product-eng"
              echo "Building with $product-eng..."
              mka recoveryimage -j1 2>&1 | tee build_output_$product.log
              break
            fi
          done
        fi
        set +x
        
    - name: Check Build Output
      if: always()
      run: |
        cd workspace
        echo "=== Build artifacts ==="
        find out/target/product -name "*.img" -type f 2>/dev/null | head -20 || echo "No images found"
        
        echo "=== Log files ==="
        ls -la *.log 2>/dev/null || echo "No log files"

    - name: Upload Debug Files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Debug-Files
        path: |
          workspace/*.log
          workspace/out/error.log
          workspace/out/build.log
        if-no-files-found: warn

    - name: Upload Recovery Images
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Recovery-Images
        path: workspace/out/target/product/*/*.img
        if-no-files-found: warn
