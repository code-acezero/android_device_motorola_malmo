name: Build TWRP for Moto G85

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Clean Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize Repo (Low Space Mode)
      run: |
        export PATH=~/bin:$PATH
        mkdir workspace
        cd workspace
        # Using depth=1 is critical since we removed swap (saves disk space)
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all)

    - name: Clone Device Tree (Robust Mode)
      run: |
        cd workspace
        # FIX: Manually create the parent folders so git clone doesn't fail
        mkdir -p device/motorola
        git clone https://github.com/code-acezero/android_device_motorola_malmo device/motorola/malmo

    - name: 🔧 FIX - Force Rename DTB (Smart Find)
      run: |
        cd workspace
        echo "Searching for DTB file..."
        
        # Find the file 'dtb' anywhere inside device/motorola
        DTB_PATH=$(find device/motorola -name "dtb" -type f | head -n 1)
        
        if [ -z "$DTB_PATH" ]; then
          echo "Warning: File 'dtb' not found. Checking if it is already named 'dtb.img'..."
          DTB_PATH=$(find device/motorola -name "dtb.img" -type f | head -n 1)
        fi
        
        if [ -z "$DTB_PATH" ]; then
          echo "CRITICAL ERROR: Could not find any DTB file! Listing directory:"
          ls -R device/motorola
          exit 1
        fi

        echo "Found file at: $DTB_PATH"
        
        # Get the directory of the file
        DIR_NAME=$(dirname "$DTB_PATH")
        
        # Rename it to dtb.img
        mv "$DTB_PATH" "$DIR_NAME/dtb.img"
        echo "Renamed file to: $DIR_NAME/dtb.img"

    - name: Build Recovery
      run: |
        export PATH=~/bin:$PATH
        cd workspace
        . build/envsetup.sh
        lunch omni_malmo-eng
        # CRITICAL: Do NOT remove -j2. Without swap, higher values will crash the RAM.
        mka vendorbootimage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-G85
        path: workspace/out/target/product/malmo/vendor_boot.img
