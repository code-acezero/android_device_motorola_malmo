name: Debug File System

on:
  workflow_dispatch:

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Your Repo
      uses: actions/checkout@v4

    - name: 🔍 List Prebuilt Directory (Is it there?)
      run: |
        echo "========================================"
        echo "Listing contents of: device/motorola/malmo/prebuilt/"
        echo "========================================"
        ls -la device/motorola/malmo/prebuilt/

    - name: 🕵️ Check Specific DTB File
      run: |
        echo "========================================"
        echo "Checking file details for 'dtb'..."
        echo "========================================"
        # This will fail if the file doesn't exist, telling us the truth immediately
        ls -l device/motorola/malmo/prebuilt/dtb || echo "❌ FILE NOT FOUND: 'dtb' does not exist!"
        
    - name: 📂 List EVERYTHING (Just in case)
      run: |
        echo "========================================"
        echo "Recursive list of device tree:"
        echo "========================================"
        find device/motorola/malmo -maxdepth 3
